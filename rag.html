<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Simulator</title>

<style>
:root {
    --bg: #f5f5f7;
    --card: rgba(255,255,255,.86);
    --text: #171717;
    --muted: #6e6e73;
    --border: #dedee3;
    --blue: #0071e3;
    --green: #248a3d;
    --dark: #111114;
    --radius: 22px;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Inter,
        Arial,
        sans-serif;
    background: linear-gradient(180deg,#fbfbfd,#f1f1f4);
    color: var(--text);
}

.container {
    max-width: 1250px;
    margin: auto;
    padding: 35px 22px 60px;
}

/* HEADER */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 13px;
}

.logo {
    width: 45px;
    height: 45px;
    border-radius: 14px;
    background: #111;
    color: white;
    display: grid;
    place-items: center;
    font-weight: 800;
}

.eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--muted);
    font-weight: 700;
}

h1 {
    margin: 4px 0;
    font-size: 42px;
    letter-spacing: -2px;
}

.subtitle {
    color: var(--muted);
    font-size: 14px;
}

.reset {
    border: 1px solid var(--border);
    background: white;
    padding: 10px 17px;
    border-radius: 999px;
}

/* HERO */

.hero {
    background:
        linear-gradient(135deg,#111,#29292d);
    color: white;
    padding: 30px;
    border-radius: 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,.12);
}

.hero h2 {
    margin: 0 0 8px;
    font-size: 25px;
}

.hero p {
    color: #c8c8cc;
    max-width: 800px;
    line-height: 1.55;
}

/* PIPELINE */

.pipeline {
    display: grid;
    grid-template-columns: repeat(7,1fr);
    gap: 8px;
    margin-top: 25px;
}

.step {
    padding: 13px;
    min-height: 75px;
    border-radius: 16px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.13);
```
